behavioral_updates:
- id: falsification-self-review-20261009
  classification: behavioral-update
  source_context: Falsification-based Python design review proposal.
  source_commit: c14cb8a03a16e21bb6d327e5c7c3698e9686da8d
  status: pending-independent-evaluation
  mechanism: extend-existing-skill
  rationale: The existing Python code-design trigger and output contract already cover this work; add design falsification within that workflow rather than a duplicate skill or a mandatory architecture rule.
  user_problem: Local change scenarios can ratify a candidate whose concepts, responsibility ownership or transitive dependencies are wrong.
  intended_deliverable: Evidence-linked candidate falsification, minimal revision and same-rubric re-evaluation before a design recommendation, while preserving public API, DI and read-only boundaries.
  inputs: Repository or explicitly supplied hypothetical facts, use cases, entrypoints, state, effects, contracts, dependency constraints and a candidate design.
  outputs: Existing design deliverable plus ten-dimension verdicts, counterfactuals for every new boundary, entrypoint dependency traces and unresolved-evidence limits.
  constraints:
  - No mandatory layers, Protocols, DDD or domain-specific template.
  - Missing evidence stays provisional and does not become Pass or N/A.
  - Preserve all existing regression cases, task and requirement IDs, routing description and historical evidence.
  - Source-only change; no runtime skill installation, downstream edits, runner replacement, model API or credentials.
  external_side_effects: None during evaluation; candidate files and isolated trial artifacts only.
  risk_assessment:
    incorrect_deliverable: False confidence in a design can preserve duplicate state authority or leak optional dependencies into runtime-critical entrypoints.
    authority_and_reversibility: Source documentation and evaluation cases are reversible; downstream project mutation remains governed by the requested mode.
    operational_reliance: Design recommendations and read-only reviews may guide implementation decisions.
    distribution: Existing personal repository skill.
    tier: deep
  critical_requirements:
  - candidate-falsification-revision-same-rubric
  - all-ten-evidence-linked-verdicts
  - every-new-boundary-merge-delete
  - each-entrypoint-transitive-dependency-trace
  - missing-facts-stay-provisional
  - small-cohesive-layout-not-overengineered
  - preserve-original-output-contract-and-authority
  fixed_cases_added:
  - falsify-local-but-invalid-candidate
  - retain-cohesive-small-design
  - keep-missing-evidence-provisional
  required_gates:
  - At least two independent trials per critical behavior scenario.
  - Representative paired no-skill comparison with identical raw inputs and separate grading.
  - Two consecutive clear behavior rounds after the last behavior edit.
  - Final regression and holdout kept out of the edit loop.
  routing: Description and installation environment are unchanged; retain historical routing evidence without claiming a new routing run.
  observed_checks:
  - System quick_validate.py passed on the repository candidate.
  - Existing bundled validate_skill.py passed on the repository candidate.
  - git diff --check passed.
  unrun_checks:
  - Independent behavioral evaluation, baseline comparison, convergence, final regression and untouched holdout are pending.
  limitations:
  - Structural checks do not establish behavioral success or installation.
  - Prior historical pass records do not validate this revision.

