skill: design-python-code
decision:
  status: accepted
  mechanism: skill
  rationale: Pythonコードの構造設計・実装・reviewで繰り返し使う専門的な判断workflowであり、常時適用する短いrepository ruleや機械的linterでは代替できない。
  existing_skills_checked:
  - write-design-doc
  - skill-creator
  - create-validated-skill
  overlap: write-design-docは複数system・teamにまたがる合意文書を作るworkflowであり、Python code単位の配置・責務分割・実装reviewは対象外。
updates:
- id: ml-vertical-slice-20260828
  classification: behavioral-update
  user_problem: technical layer分割によりalgorithm変更が複数箇所へ波及し、Notebook・CLI・ML pipelineにも同じ処理が重複する設計を避けたい。
  intended_deliverable: design-python-codeが変更理由をvariantへ閉じ込め、共通use caseを複数entrypointから呼ぶ最小構成を設計・reviewできること。
  inputs: 既存tree、caller、実行形態、algorithm/provider variation、設定・DI、公開API、変更シナリオ。
  outputs: 提案tree、variant/use case/pipeline/infrastructureの責務、依存方向、既存variant変更と新規variant追加の非波及範囲、trade-off。
  constraints:
  - 固定のML directory templateを全Python projectへ強制しない。
  - domainやtechnical layerを名前だけで追加しない。
  - orchestrator、Registry、Protocolは現在の必要性に比例させる。
  external_side_effects: skill package内のinstruction・reference・eval更新だけ。対象projectや外部systemは変更しない。
  risk_assessment:
    incorrect_deliverable: 設計助言がalgorithm変更の波及や実験・本番処理の分岐を固定化する可能性がある。
    authority_and_reversibility: local skill文書の変更でありversion controlから復元可能。利用先projectは自動変更しない。
    operational_reliance: Python/ML code設計時の判断に利用されるため、誤った固定template化を避ける必要がある。
    distribution: 個人環境のinstalled skill。
    tier: deepを維持する。
  critical_requirements:
  - id: variant-locality
    statement: algorithm固有の変更を一つのvariant sliceへ局所化する。
  - id: use-case-reuse
    statement: Notebook、CLI、pipelineが同じuse caseを再利用する。
  - id: orchestrator-boundary
    statement: orchestrator固有依存をapplication coreへ漏らさない。
  - id: addition-locality
    statement: 新規variant追加時の既存変更を一つのcomposition/selection pointへ限定する。
  scenarios:
  - typical: iALSがtechnical layerへ分散し、KFP・CLI・Notebookで学習処理が重複している推薦systemを再設計する。
  - edge: 小規模で凝集したlibraryはfile数だけでvertical slice化せずflat packageを維持する。
  - negative: 単純なSyntaxError修正には構造設計を持ち込まない。
  trigger_examples:
    positive: ML algorithm変更がmodels/features/services/configへ散るので構成を見直したい。
    negative: Python functionの括弧抜けを直したい。
    near_miss: 複数team合意用のML pipeline Design Docを書きたい。
