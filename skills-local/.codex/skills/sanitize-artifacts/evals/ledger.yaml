skill: sanitize-artifacts
decision:
  status: accepted
  mechanism: skill
  rationale: Artifact sanitation is a reusable, selectively triggered revision workflow
    whose value is preserving audience-facing requirements while removing production-process
    residue. It is too detailed and task-specific for a global AGENTS.md rule and
    cannot be enforced reliably by a deterministic text linter.
  existing_skills_checked:
  - documents:documents
  - skill-creator
  - create-validated-skill
  overlap: documents:documents owns Word document editing and rendering, while sanitize-artifacts
    is format-independent and only governs the content revision judgment. The skill
    creation guides govern this package's creation rather than its runtime behavior.
risk:
  incorrect_deliverable_consequence: A sanitized artifact could leak internal production
    context or remove a caveat its audience needs, but the output remains reviewable
    before publication.
  side_effect_authority: The workflow edits only artifacts the user placed in scope
    and does not authorize publication or external writes.
  reversibility: Local artifact revisions are reversible through the working tree
    or source copy.
  operational_reliance: Moderate; a user may publish the result after review.
  distribution: Personal local skill.
  tier: standard
iterations:
- id: routing-iteration-0
  revision: user-provided implementation
  run: 20260826T080032Z
  result: failed
  evidence: Positive and near-miss routing passed, but the EXIF metadata removal negative
    case activated sanitize-artifacts.
  failure: The description used generated artifacts and sanitize without limiting
    the workflow to user-facing content revision.
  change: Limited the description and activation guidance to user-facing content and
    excluded file or media metadata, security sanitizers, data cleaning, and source-code
    review.
- id: baseline-comparison
  revision: routing-boundary-fixed implementation
  run: 20260826T075921Z
  result: comparable
  evidence: The with-skill and without-skill fresh executors both passed all three requirements for the representative onboarding-guide scenario.
  failure: ''
  change: Kept the skill because its explicit content classification, audience-caveat preservation, and artifact-first output contract provide repeatability across more complex iterative artifacts; avoided adding instructions for capabilities the baseline already demonstrated.
- id: routing-iteration-1
  revision: routing-boundary-fixed implementation
  run: 20260826T080220Z
  result: clear
  evidence: Isolated positive activation was 1.0, while negative and near-miss false activation were both 0.0.
  failure: ''
  change: ''
- id: behavior-regression
  revision: routing-boundary-fixed implementation
  run: 20260826T080305Z
  result: clear
  evidence: Typical, edge, and negative scenarios passed 3/3 tasks and 7/7 critical requirements with no unclear points or retries.
  failure: ''
  change: ''
failure_patterns:
- general_fix_rule: Distinguish revision of audience-facing artifact content from
    technical sanitization of files, metadata, data, or code.
  example_issue: An EXIF metadata removal request activated a skill intended to remove
    conversation residue from prose deliverables.
  seen_in:
  - run: 20260826T080032Z
    task: strip-image-metadata
    trial: 1
    source: routing
