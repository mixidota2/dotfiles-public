skill: create-validated-skill
decision:
  status: accepted
  mechanism: skill
  reason: Reusable skill creation needs selective activation and a multi-step evaluation
    workflow.
  existing_skills_checked:
  - skill-creator
  distinction: Adds mandatory behavioral, trigger, baseline, convergence, holdout,
    and ledger gates.
static_validation:
  system_quick_validate:
    status: pass
    command: uv run --with pyyaml python quick_validate.py <skill-directory>
    note: PyYAML was not installed in the default interpreter.
  strict_validator:
    status: pass
    command: python3 scripts/validate_skill.py <skill-directory>
  script_tests:
    status: pass
    evidence:
    - Both Python scripts compiled successfully.
    - Initialization created the expected scaffold.
    - Reinitialization refused to overwrite an existing target with exit status 2.
    - Validation rejected an unresolved scaffold with exit status 1.
iterations:
- id: iteration-1
  revision: initial-implementation
  tier: deep
  trials:
  - scenario: create-domain-skill
    trial: 1
    skill_available: true
    verdict: pass
    evidence: Searched for overlap, reused canonical resources, defined trigger coverage,
      and required deep fresh-agent evaluation before completion.
  - scenario: revise-trigger-mismatch
    trial: 1
    skill_available: true
    verdict: pass
    evidence: Recorded iteration zero, preserved regression behavior, aligned description
      and body, and treated missing runtime evidence as unvalidated.
  - scenario: reject-unnecessary-skill
    trial: 1
    skill_available: true
    verdict: pass
    evidence: Rejected a new skill and located the equivalent global AGENTS.md rule.
  critical_failures: 0
  deterministic_unclear_points: 0
  result: clear
- id: iteration-2
  revision: initial-implementation
  tier: deep
  trials:
  - scenario: create-domain-skill
    trial: 2
    skill_available: true
    verdict: pass
    evidence: Repeated non-duplication, trigger, fixed-scenario, two-trial, baseline,
      convergence, and holdout requirements.
  - scenario: revise-trigger-mismatch
    trial: 2
    skill_available: true
    verdict: pass
    evidence: Repeated iteration-zero, minimal revision, regression, and deep-tier
      validation behavior.
  - scenario: reject-unnecessary-skill
    trial: 2
    skill_available: true
    verdict: pass
    evidence: Again redirected the always-on rule to global AGENTS.md without scaffolding
      a skill.
  critical_failures: 0
  deterministic_unclear_points: 0
  result: clear
baseline:
  trials:
  - scenario: create-domain-skill
    skill_available: false
    verdict: weaker
    evidence: Proposed structure and static validation but no fixed behavioral scenarios,
      ledger, baseline, convergence, or holdout.
  - scenario: revise-trigger-mismatch
    skill_available: false
    verdict: weaker
    evidence: Proposed forward tests but no durable scenario suite, ledger, baseline
      comparison, or convergence rule.
  - scenario: reject-unnecessary-skill
    skill_available: false
    verdict: fail
    evidence: Proposed creating a globally triggered skill instead of using an always-on
      AGENTS.md rule.
holdout:
  scenario: choose-deterministic-enforcement
  trials:
  - trial: 1
    verdict: pass
    evidence: Distinguished local-hook limitations and made CI plus protected-branch
      controls the deterministic enforcement layer.
  - trial: 2
    verdict: pass
    evidence: Again made CI plus protected-branch or server-side controls the guarantee
      and treated the skill only as an installation and verification workflow.
